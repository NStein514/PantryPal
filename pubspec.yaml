name: pantrypal
description: Smart pantry & expiration tracker with AI recipes.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.13.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  intl: any # pinned by flutter_localizations
  share_plus: ^10.1.4
  file_picker: ^8.1.4
  home_widget: ^0.7.0
  animations: ^2.0.11 # Material motion: container transform, fade through
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3
flutter:
  uses-material-design: true
  generate: true # runs gen-l10n on pub get (see l10n.yaml)
